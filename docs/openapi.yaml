openapi: 3.1.0
info:
  title: Fullstack Calculator API
  version: 0.3.0
  description: |
    REST API for the fullstack calculator.

    Expressions may contain digits, `.`, `+`, `-`, `*`, `/`, `^`, `%`, `√`
    (or its aliases `V` and `v`), `(` and `)` only.

    Precedence from highest to lowest:
    1. parentheses
    2. `^` power, right-associative: `2^3^2 = 512`, `2^-1 = 0.5`
    3. unary minus and `√` square root, right-associative: `-2^2 = -4`,
       `√16^0.5 = 2`, `√√16 = 2`
    4. `*`, `/` and `%`, left-associative. `A%B` is A percent of B, i.e.
       `A*B/100`: `10%200 = 20`, `100/10%50 = 5`, `10%2^3 = 0.8`
    5. `+` and `-`, left-associative

    Only one binary operator may sit between operands; a single minus sign
    may follow it (`2^-1`, `2--2`). Implicit multiplication such as `2(3)`
    or `2√4` is rejected. Numbers may start with a period (`.5`) but may not
    end with one (`5.`).

    Division, `√` and fractional or negative powers keep 34 significant
    digits internally. Positive integer powers are exact while their digit
    count fits the power limit. Only the final result is rounded, once, to
    16 decimal places, half away from zero, with trailing zeros stripped.

    `0^0 = 1`; `0` raised to a negative power is `undefined`, like division
    by zero. A power `a^b` with `|b * log10(|a|)|` above the configured limit
    (`POWER_LIMIT`, default 100000) is refused with 422, and so is `√` of a
    negative number or a negative base with a non-integer exponent. The same
    422 refusal applies to any intermediate result with more than
    `max(POWER_LIMIT, 16384) + 34` digits or that order of magnitude, and to
    exact integer powers adding up to more than 10 x `POWER_LIMIT` digits in
    one expression.
security: []
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /validate:
    post:
      operationId: validateExpression
      summary: Validate an expression, including whether it can be computed
      tags: [calculator]
      requestBody:
        $ref: "#/components/requestBodies/Expression"
      responses:
        "200":
          description: Expression is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOk"
              example:
                result: Ok
        "400":
          $ref: "#/components/responses/Invalid"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/Internal"
  /calculate:
    post:
      operationId: calculateExpression
      summary: Evaluate an expression
      tags: [calculator]
      requestBody:
        $ref: "#/components/requestBodies/Expression"
      responses:
        "200":
          description: |
            Expression evaluated. `result` is rounded for display. `exact` is
            the unrounded internal value, which clients can send back when
            they chain further operations onto the result. Division by zero
            returns `undefined` with no `exact`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                number:
                  value:
                    result: "0.3333333333333333"
                    exact: "0.3333333333333333333333333333333333"
                squareRoot:
                  value:
                    result: "1.414213562373095"
                    exact: "1.414213562373095048801688724209698"
                fractionalPower:
                  value:
                    result: "1.2599210498948732"
                    exact: "1.259921049894873164767210607278228"
                divisionByZero:
                  value:
                    result: undefined
        "400":
          $ref: "#/components/responses/Invalid"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/Internal"
components:
  requestBodies:
    Expression:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExpressionRequest"
          example:
            expression: 4+5
  responses:
    Invalid:
      description: Malformed body or one or more rule violations
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          examples:
            incomplete:
              value:
                errors: ["Incomplete expression: missing operand after '*' at position 2"]
            several:
              value:
                errors:
                  - Number '1..2' at position 1 has more than one decimal point
                  - Unclosed '(' at position 5
            malformedBody:
              value:
                errors: ["Request body must be a JSON object with a string 'expression'"]
    Unprocessable:
      description: The expression is valid but its computation is refused
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          examples:
            computationLimit:
              value:
                errors: [power operation refused due to computation limit exceeded]
            imaginary:
              value:
                errors: [imaginary numbers not supported]
    Internal:
      description: Unexpected evaluation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          example:
            errors: [Internal error]
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ExpressionRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          maxLength: 16384
          example: 4+5
    ValidationOk:
      type: object
      required: [result]
      properties:
        result:
          type: string
          const: Ok
    Calculation:
      type: object
      required: [result]
      properties:
        result:
          type: string
          description: Rounded value, or `undefined` on division by zero
          example: "0.3333333333333333"
        exact:
          type: string
          description: Unrounded internal value, omitted when the result is undefined
          example: "0.3333333333333333333333333333333333"
    Errors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: string
