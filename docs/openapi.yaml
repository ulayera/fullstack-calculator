openapi: 3.1.0
info:
  title: Fullstack Calculator API
  version: 0.2.0
  description: |
    REST API for the fullstack calculator.

    Expressions may contain digits, `.`, `+`, `-`, `*`, `/`, `(` and `)` only.
    Precedence from highest to lowest: parentheses, unary minus
    (right-associative, at most one sign per operand), `*` and `/`
    (left-associative), `+` and `-` (left-associative). Implicit
    multiplication such as `2(3)` is rejected. Numbers may start with a
    period (`.5`) but may not end with one (`5.`).

    Division keeps 34 significant digits internally. The final result is rounded
    once to 16 decimal places, half away from zero, with trailing zeros
    stripped.
security: []
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /validate:
    post:
      operationId: validateExpression
      summary: Validate an expression without evaluating it
      tags: [calculator]
      requestBody:
        $ref: "#/components/requestBodies/Expression"
      responses:
        "200":
          description: Expression is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationOk"
              example:
                result: Ok
        "400":
          $ref: "#/components/responses/Invalid"
  /calculate:
    post:
      operationId: calculateExpression
      summary: Evaluate an expression
      tags: [calculator]
      requestBody:
        $ref: "#/components/requestBodies/Expression"
      responses:
        "200":
          description: |
            Expression evaluated. `result` is rounded for display. `exact` is
            the unrounded internal value, which clients can send back when
            they chain further operations onto the result. Division by zero
            returns `undefined` with no `exact`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                number:
                  value:
                    result: "0.3333333333333333"
                    exact: "0.3333333333333333333333333333333333"
                divisionByZero:
                  value:
                    result: undefined
        "400":
          $ref: "#/components/responses/Invalid"
        "500":
          description: Unexpected evaluation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
              example:
                errors: [Internal error]
components:
  requestBodies:
    Expression:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExpressionRequest"
          example:
            expression: 4+5
  responses:
    Invalid:
      description: Malformed body or one or more rule violations
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Errors"
          examples:
            incomplete:
              value:
                errors: ["Incomplete expression: missing operand after '*' at position 2"]
            several:
              value:
                errors:
                  - Number '1..2' at position 1 has more than one decimal point
                  - Unclosed '(' at position 5
            malformedBody:
              value:
                errors: ["Request body must be a JSON object with a string 'expression'"]
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ExpressionRequest:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          maxLength: 16384
          example: 4+5
    ValidationOk:
      type: object
      required: [result]
      properties:
        result:
          type: string
          const: Ok
    Calculation:
      type: object
      required: [result]
      properties:
        result:
          type: string
          description: Rounded value, or `undefined` on division by zero
          example: "0.3333333333333333"
        exact:
          type: string
          description: Unrounded internal value, omitted when the result is undefined
          example: "0.3333333333333333333333333333333333"
    Errors:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          minItems: 1
          items:
            type: string
