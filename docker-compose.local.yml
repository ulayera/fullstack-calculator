name: fullstack-calculator-local

services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: "8080"
      POWER_LIMIT: ${POWER_LIMIT:-100000}
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  app:
