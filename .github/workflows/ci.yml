name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race -coverpkg=./internal/... -coverprofile=coverage.out
      - name: Enforce 100% coverage
        run: |
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          [ "$total" = "100.0%" ] || { echo "coverage $total is below 100%"; exit 1; }
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx --yes @redocly/cli@2.83.0 lint docs/openapi.yaml

  e2e:
    needs: [backend, frontend, openapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build --wait
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
          npm run typecheck
          npx playwright test
      - if: failure()
        run: docker compose logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tmp/e2e
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
